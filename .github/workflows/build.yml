name: build

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: podman version
        run: podman version

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build arm64 image
        run: |
          set -o pipefail
          podman build --platform linux/arm64 \
            -f Containerfile \
            -t ghcr.io/${{ github.repository }}:arm64 \
            . 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Push image
        if: success()
        run: podman push ghcr.io/${{ github.repository }}:arm64

      - name: Push build log to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/logpush && cd /tmp/logpush
          git init -q
          git config user.email "ci@example.com"
          git config user.name "ci-bot"
          cp "$GITHUB_WORKSPACE/build.log" . 2>/dev/null || echo "no build.log produced" > build.log
          git add build.log
          git commit -q -m "build log $(date -u +%FT%TZ)"
          git branch -M ci-logs
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
