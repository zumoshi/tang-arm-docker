name: build

on:
  push:
    branches: [main]
    paths:
      - Containerfile
      - .github/workflows/build.yml
  workflow_dispatch: {}

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (arm64)
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: podman version
        run: podman version

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build arm64 image
        run: |
          set -o pipefail
          podman build --platform linux/arm64 \
            -f Containerfile \
            -t ghcr.io/${{ github.repository }}:arm64 \
            . 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      # Runs the actual freshly built arm64 image (under the same QEMU
      # emulation as the build) against a throwaway /db, and hits /adv.
      # This exercises tang's real first-run key-generation path, the
      # exact thing that silently broke ("Error generating JWK with alg
      # ES512") and only showed up once running on the router. Discarded
      # regardless of outcome; the point is to fail the CI job here
      # instead of finding out after a repull on hardware.
      - name: Smoke test - key generation and /adv
        run: |
          set -o pipefail
          {
          mkdir -p /tmp/smoketest-db
          podman run -d --name tang-smoketest \
            -p 127.0.0.1:19090:9090 \
            -v /tmp/smoketest-db:/db \
            ghcr.io/${{ github.repository }}:arm64

          ok=0
          for i in $(seq 1 20); do
            sleep 1
            if curl -sf http://127.0.0.1:19090/adv -o /tmp/adv.json; then
              ok=1
              break
            fi
          done

          echo "--- container log ---"
          podman logs tang-smoketest || true
          podman rm -f tang-smoketest || true
          rm -rf /tmp/smoketest-db

          if [ "$ok" -ne 1 ]; then
            echo "Smoke test failed: /adv did not return 200 within 20s"
            exit 1
          fi
          echo "--- /adv response ---"
          cat /tmp/adv.json
          echo
          echo "Smoke test passed"
          } 2>&1 | tee -a "$GITHUB_WORKSPACE/build.log"
          # tee always exits 0; surface the real exit code of the block above.
          exit "${PIPESTATUS[0]}"

      - name: Push image
        if: success()
        run: podman push ghcr.io/${{ github.repository }}:arm64

      - name: Push build log to ci-logs branch
        if: always()
        run: |
          mkdir -p /tmp/logpush && cd /tmp/logpush
          git init -q
          git config user.email "ci@example.com"
          git config user.name "ci-bot"
          cp "$GITHUB_WORKSPACE/build.log" . 2>/dev/null || echo "no build.log produced" > build.log
          git add build.log
          git commit -q -m "build log $(date -u +%FT%TZ)"
          git branch -M ci-logs
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-logs
